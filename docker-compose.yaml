version: "3"

services:
  backend:
    build: .
    container_name: gstio-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "4000" # expose only to internal network
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - webnet

  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gstdb-admin
      POSTGRES_PASSWORD: gstiowebdb1234
      POSTGRES_DB: gstio-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - webnet

  redis:
    image: redis:7
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - webnet

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - webnet

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  webnet:


